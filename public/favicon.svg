<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1026" />
      <stop offset="70%" stop-color="#05070f" />
      <stop offset="100%" stop-color="#020307" />
    </radialGradient>

    <!-- Cyan Energy Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#00a8ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </radialGradient>

    <!-- Mystical Orange Energy Glow -->
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="1" />
      <stop offset="40%" stop-color="#ff6b00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Background Base -->
  <circle cx="256" cy="256" r="246" fill="url(#obsidianBg)" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.4" />

  <!-- Background Cybernetics Grid Pattern -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ff6b00" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.4" />

  <!-- Outer Cyan Glowing Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00f3ff" stroke-width="6" filter="url(#neonGlow)" opacity="0.9" />

  <!-- Inner Mystical Orange Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ff6b00" stroke-width="5" filter="url(#neonGlow)" opacity="0.95" />

  <!-- 3D Sudarshan Energy Ring & Spinning Blades -->
  <g transform="translate(256, 256) rotate(15)">
    <!-- 12 Energy Blades -->
    <g filter="url(#neonGlow)">
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(0)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(30)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(60)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(90)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(120)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(150)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(180)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(210)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(240)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(270)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(300)" />
      <path d="M 0,-200 C 40,-180 70,-140 60,-130 C 30,-120 10,-150 0,-200 Z" fill="url(#bladeGrad)" transform="rotate(330)" />
    </g>

    <!-- Energy Trails Orbit Circles -->
    <ellipse cx="0" cy="0" rx="160" ry="80" fill="none" stroke="#00f3ff" stroke-width="2" transform="rotate(-25)" opacity="0.7" />
    <ellipse cx="0" cy="0" rx="160" ry="80" fill="none" stroke="#ff6b00" stroke-width="2" transform="rotate(35)" opacity="0.7" />

    <!-- Center Glowing Energy Core -->
    <circle cx="0" cy="0" r="50" fill="url(#cyanGlow)" />
    <circle cx="0" cy="0" r="30" fill="url(#orangeGlow)" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#neonGlow)" />
  </g>
</svg>